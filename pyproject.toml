[project]
name = "cli-agent"
version = "0.1.0"
description = "Prompt Engineering project: a natural-language -> CLI command agent, with an iterative evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 6.x: Textbox takes `buttons=["copy"]`, not the old `show_copy_button`.
    "gradio>=6.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cli-agent-app = "cli_agent.app:main"
cli-agent-eval = "cli_agent.evaluation.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
